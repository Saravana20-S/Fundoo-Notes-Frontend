<div class="auth-page">

  <div class="auth-card">

    <div class="brand-logo">
      F
    </div>

    <h1>Forgot password?</h1>

    <p class="description">
      Enter your registered email address and we'll help
      you reset your password.
    </p>

    <form
      #forgotForm="ngForm"
      (ngSubmit)="onSubmit()"
      novalidate
    >

      <div class="form-group">

        <label for="email">
          Email
        </label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          #emailInput="ngModel"
          required
          email
          placeholder="Enter your email"
        />

        @if (emailInput.invalid && emailInput.touched) {

          <div class="error-message">

            @if (emailInput.errors?.['required']) {
              <span>Email is required.</span>
            }

            @if (emailInput.errors?.['email']) {
              <span>Enter a valid email address.</span>
            }

          </div>

        }

      </div>

      <button
        type="submit"
        class="submit-button"
        [disabled]="forgotForm.invalid"
      >
        Continue
      </button>

    </form>

    <div class="back-link">
      <a routerLink="/login">
        ← Back to login
      </a>
    </div>

  </div>

</div>
