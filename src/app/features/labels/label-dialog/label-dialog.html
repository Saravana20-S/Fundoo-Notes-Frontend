@if (open) {
  <div class="label-dialog-overlay" (click)="onOverlayClick()">
    <div
      class="label-dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="label-dialog-title"
      (click)="stopPropagation($event)"
    >
      <!-- ================================================= -->
      <!-- HEADER -->
      <!-- ================================================= -->

      <div class="dialog-header">
        <h2 id="label-dialog-title">Edit labels</h2>
      </div>

      <!-- ================================================= -->
      <!-- CREATE LABEL -->
      <!-- ================================================= -->

      <div class="create-label-row">
        <button
          type="button"
          class="create-cancel-button"
          title="Clear"
          aria-label="Clear label input"
          (click)="newLabelName = ''"
        >
          ×
        </button>

        <input
          type="text"
          class="create-label-input"
          placeholder="Create new label"
          [(ngModel)]="newLabelName"
          maxlength="50"
          (keyup.enter)="createLabel()"
        />

        <button
          type="button"
          class="create-confirm-button"
          title="Create label"
          aria-label="Create label"
          [disabled]="!newLabelName.trim() || isSaving"
          (click)="createLabel()"
        >
          ✓
        </button>
      </div>

      <!-- ================================================= -->
      <!-- ERROR -->
      <!-- ================================================= -->

      @if (errorMessage) {
        <div class="dialog-error">
          {{ errorMessage }}
        </div>
      }

      <!-- ================================================= -->
      <!-- LABEL LIST -->
      <!-- ================================================= -->

      <div class="label-list">
        @for (label of labels; track label.id) {
          @if (editingLabelId === label.id) {
            <!-- EDIT MODE -->

            <div class="label-row edit-row">
              <span class="label-icon"> 🏷 </span>

              <input
                type="text"
                class="edit-label-input"
                [(ngModel)]="editingLabelName"
                maxlength="50"
                (keyup.enter)="saveEdit(label)"
              />

              <button
                type="button"
                class="label-action-button"
                title="Save"
                aria-label="Save label"
                (click)="saveEdit(label)"
              >
                ✓
              </button>

              <button
                type="button"
                class="label-action-button"
                title="Cancel"
                aria-label="Cancel"
                (click)="cancelEdit()"
              >
                ×
              </button>
            </div>
          } @else {
            <!-- NORMAL MODE -->

            <div class="label-row">
              <span class="label-icon"> 🏷 </span>

              <span class="label-name">
                {{ label.name }}
              </span>

              <button
                type="button"
                class="label-action-button edit-button"
                title="Rename label"
                aria-label="Rename label"
                (click)="startEdit(label)"
              >
                ✎
              </button>

              <button
                type="button"
                class="label-action-button delete-button"
                title="Delete label"
                aria-label="Delete label"
                (click)="deleteLabel(label)"
              >
                🗑
              </button>
            </div>
          }
        }

        <!-- ================================================= -->
        <!-- NO LABELS -->
        <!-- ================================================= -->

        @if (labels.length === 0) {
          <div class="no-labels">No labels yet</div>
        }
      </div>

      <!-- ================================================= -->
      <!-- FOOTER -->
      <!-- ================================================= -->

      <div class="dialog-footer">
        <button type="button" class="done-button" (click)="done()">Done</button>
      </div>
    </div>
  </div>
}
