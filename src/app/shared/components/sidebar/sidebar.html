<aside class="sidebar">
  <nav class="sidebar-nav" aria-label="Main navigation">
    <!-- ================================================= -->
    <!-- NOTES -->
    <!-- ================================================= -->

    <a
      routerLink="/notes"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="sidebar-item"
      (click)="selectNavigation()"
    >
      <span class="sidebar-icon"> 💡 </span>

      <span class="sidebar-label"> Notes </span>
    </a>

    <!-- ================================================= -->
    <!-- REMINDERS -->
    <!-- ================================================= -->

    <a
      routerLink="/reminders"
      routerLinkActive="active"
      class="sidebar-item"
      (click)="selectNavigation()"
    >
      <span class="sidebar-icon"> ♧ </span>

      <span class="sidebar-label"> Reminders </span>
    </a>

    <!-- ================================================= -->
    <!-- USER LABELS -->
    <!-- ================================================= -->

    @for (label of labels; track label.id) {
      <a
        [routerLink]="['/label', label.id]"
        routerLinkActive="active"
        class="sidebar-item label-sidebar-item"
        (click)="selectNavigation()"
      >
        <span class="sidebar-icon"> 🏷 </span>

        <span class="sidebar-label">
          {{ label.name }}
        </span>
      </a>
    }

    <!-- ================================================= -->
    <!-- EDIT LABELS -->
    <!-- ================================================= -->

    <button type="button" class="sidebar-item sidebar-button" (click)="openLabelDialog()">
      <span class="sidebar-icon"> ✎ </span>

      <span class="sidebar-label"> Edit labels </span>
    </button>

    <!-- ================================================= -->
    <!-- ARCHIVE -->
    <!-- ================================================= -->

    <a
      routerLink="/archive"
      routerLinkActive="active"
      class="sidebar-item"
      (click)="selectNavigation()"
    >
      <span class="sidebar-icon"> ▣ </span>

      <span class="sidebar-label"> Archive </span>
    </a>

    <!-- ================================================= -->
    <!-- TRASH -->
    <!-- ================================================= -->

    <a
      routerLink="/trash"
      routerLinkActive="active"
      class="sidebar-item"
      (click)="selectNavigation()"
    >
      <span class="sidebar-icon"> ▥ </span>

      <span class="sidebar-label"> Bin </span>
    </a>
  </nav>

  <!-- ===================================================== -->
  <!-- LABEL DIALOG -->
  <!-- ===================================================== -->

  <app-label-dialog [open]="isLabelDialogOpen" (closed)="closeLabelDialog()"> </app-label-dialog>
</aside>
